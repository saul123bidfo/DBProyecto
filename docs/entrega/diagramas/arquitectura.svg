<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Arial, Helvetica, sans-serif"><defs><marker id="flecha" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 z" fill="#111111"/></marker></defs><rect width="860" height="600" fill="white"/><rect x="20" y="30" width="220" height="205" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><path d="M20,70 V44 Q20,30 34,30 H226 Q240,30 240,44 V70 Z" fill="#111111"/><text x="130" y="57" font-size="14.5" fill="#C1F11D" text-anchor="middle" font-weight="700">NAVEGADOR</text><text x="36" y="96" font-size="13.5" fill="#111111" text-anchor="start" font-weight="700">React 18.3.1</text><text x="36" y="125" font-size="13.5" fill="#111111" text-anchor="start">Vite 6.4.4</text><text x="36" y="154" font-size="13.5" fill="#111111" text-anchor="start">9 módulos de operación</text><text x="36" y="183" font-size="13.5" fill="#111111" text-anchor="start">+ Explorador BD</text><text x="36" y="212" font-size="13.5" fill="#111111" text-anchor="start">+ Consultas SQL</text><rect x="320" y="30" width="220" height="205" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><path d="M320,70 V44 Q320,30 334,30 H526 Q540,30 540,44 V70 Z" fill="#111111"/><text x="430" y="57" font-size="14.5" fill="#C1F11D" text-anchor="middle" font-weight="700">SERVIDOR</text><text x="336" y="96" font-size="13.5" fill="#111111" text-anchor="start" font-weight="700">Express 4.22.3</text><text x="336" y="125" font-size="13.5" fill="#111111" text-anchor="start">Node.js ≥ 20.19</text><text x="336" y="154" font-size="13.5" fill="#111111" text-anchor="start">validate() de entradas</text><text x="336" y="183" font-size="13.5" fill="#111111" text-anchor="start">helper transaction()</text><text x="336" y="212" font-size="13.5" fill="#111111" text-anchor="start">catálogo de 6 consultas</text><rect x="620" y="30" width="220" height="205" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><path d="M620,70 V44 Q620,30 634,30 H826 Q840,30 840,44 V70 Z" fill="#111111"/><text x="730" y="57" font-size="14.5" fill="#C1F11D" text-anchor="middle" font-weight="700">BASE DE DATOS</text><text x="636" y="96" font-size="13.5" fill="#111111" text-anchor="start" font-weight="700">MySQL 8.0.44 · InnoDB</text><text x="636" y="125" font-size="13.5" fill="#111111" text-anchor="start">8 tablas · 9 FK RESTRICT</text><text x="636" y="154" font-size="13.5" fill="#111111" text-anchor="start">15 CHECK · 18 triggers</text><text x="636" y="183" font-size="13.5" fill="#111111" text-anchor="start">utf8mb4</text><text x="636" y="212" font-size="13.5" fill="#111111" text-anchor="start">INFORMATION_SCHEMA</text><polyline points="244,110 316,110" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><polyline points="316,150 244,150" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><text x="280.0" y="98" font-size="10.5" fill="#6B7280" text-anchor="middle" font-weight="700">HTTP·JSON</text><text x="280.0" y="172" font-size="10.5" fill="#6B7280" text-anchor="middle">/api/…</text><polyline points="544,110 616,110" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><polyline points="616,150 544,150" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><text x="580.0" y="98" font-size="10.5" fill="#6B7280" text-anchor="middle" font-weight="700">mysql2</text><text x="580.0" y="172" font-size="10.5" fill="#6B7280" text-anchor="middle">pool de 8</text><rect x="20" y="262" width="820" height="92" rx="14" fill="#F3F6EC" stroke="none" stroke-width="0"/><text x="40" y="292" font-size="13.5" fill="#2F7D00" text-anchor="start" font-weight="700">ENTORNO DE EJECUCIÓN</text><text x="40" y="318" font-size="13" fill="#111111" text-anchor="start">Docker Compose: servicios db · setup · app</text><text x="40" y="340" font-size="13" fill="#6B7280" text-anchor="start">Puertos solo en loopback (app 3000 · MySQL 3307). Sin autenticación: demostración local.</text><rect x="20" y="380" width="820" height="124" rx="14" fill="white" stroke="#2F7D00" stroke-width="1.8" stroke-dasharray="7 5"/><text x="40" y="410" font-size="13.5" fill="#2F7D00" text-anchor="start" font-weight="700">GitHub Actions (ci.yml, en push y pull_request)</text><text x="40" y="438" font-size="12.5" fill="#111111" text-anchor="start">verify: npm ci → npm test → build → db:init (2 veces) → API e integración (MySQL 8.0.44)</text><text x="40" y="462" font-size="12.5" fill="#111111" text-anchor="start">container: docker compose up --build --wait → /api/health</text><text x="40" y="486" font-size="12.5" fill="#6B7280" text-anchor="start">Ambos jobs se ejecutan en cada push y en cada pull request.</text><text x="20" y="534" font-size="12" fill="#6B7280" text-anchor="start">El navegador nunca habla con MySQL: solo el servidor ejecuta SQL.</text><text x="20" y="552" font-size="12" fill="#6B7280" text-anchor="start">Los usuarios no tienen consola libre, únicamente las consultas del catálogo.</text></svg>