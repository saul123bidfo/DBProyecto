<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="Arial, Helvetica, sans-serif"><defs><marker id="flecha" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10 z" fill="#111111"/></marker></defs><rect width="940" height="540" fill="white"/><rect x="30" y="30" width="260" height="150" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><circle cx="60" cy="62" r="16" fill="#C1F11D" stroke="#111111" stroke-width="1.5"/><text x="60" y="68" font-size="15" fill="#111111" text-anchor="middle" font-weight="700">1</text><text x="86" y="68" font-size="16.5" fill="#111111" text-anchor="start" font-weight="700">Solicitud</text><text x="46" y="106" font-size="13" fill="#2F7D00" text-anchor="start" font-weight="700">estado «abierta»</text><text x="46" y="132" font-size="13" fill="#6B7280" text-anchor="start">el pasajero propone origen,</text><text x="46" y="151" font-size="13" fill="#6B7280" text-anchor="start">destino y precio</text><rect x="340" y="30" width="260" height="150" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><circle cx="370" cy="62" r="16" fill="#C1F11D" stroke="#111111" stroke-width="1.5"/><text x="370" y="68" font-size="15" fill="#111111" text-anchor="middle" font-weight="700">2</text><text x="396" y="68" font-size="16.5" fill="#111111" text-anchor="start" font-weight="700">Ofertas</text><text x="356" y="106" font-size="13" fill="#2F7D00" text-anchor="start" font-weight="700">0..N por solicitud</text><text x="356" y="132" font-size="13" fill="#6B7280" text-anchor="start">un vehículo ofrece monto y</text><text x="356" y="151" font-size="13" fill="#6B7280" text-anchor="start">minutos de llegada</text><rect x="650" y="30" width="260" height="150" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><circle cx="680" cy="62" r="16" fill="#C1F11D" stroke="#111111" stroke-width="1.5"/><text x="680" y="68" font-size="15" fill="#111111" text-anchor="middle" font-weight="700">3</text><text x="706" y="68" font-size="16.5" fill="#111111" text-anchor="start" font-weight="700">Aceptación</text><text x="666" y="106" font-size="13" fill="#2F7D00" text-anchor="start" font-weight="700">una transacción</text><text x="666" y="132" font-size="13" fill="#6B7280" text-anchor="start">INSERT en viaje; la solicitud</text><text x="666" y="151" font-size="13" fill="#6B7280" text-anchor="start">pasa a «aceptada»</text><rect x="30" y="250" width="260" height="150" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><circle cx="60" cy="282" r="16" fill="#C1F11D" stroke="#111111" stroke-width="1.5"/><text x="60" y="288" font-size="15" fill="#111111" text-anchor="middle" font-weight="700">4</text><text x="86" y="288" font-size="16.5" fill="#111111" text-anchor="start" font-weight="700">Viaje en curso</text><text x="46" y="326" font-size="13" fill="#2F7D00" text-anchor="start" font-weight="700">hora_inicio</text><text x="46" y="352" font-size="13" fill="#6B7280" text-anchor="start">estado: pendiente → en_curso</text><rect x="340" y="250" width="260" height="150" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><circle cx="370" cy="282" r="16" fill="#C1F11D" stroke="#111111" stroke-width="1.5"/><text x="370" y="288" font-size="15" fill="#111111" text-anchor="middle" font-weight="700">5</text><text x="396" y="288" font-size="16.5" fill="#111111" text-anchor="start" font-weight="700">Viaje finalizado</text><text x="356" y="326" font-size="13" fill="#2F7D00" text-anchor="start" font-weight="700">hora_fin</text><text x="356" y="352" font-size="13" fill="#6B7280" text-anchor="start">estado: en_curso → finalizado</text><rect x="650" y="250" width="260" height="150" rx="14" fill="white" stroke="#111111" stroke-width="1.8"/><circle cx="680" cy="282" r="16" fill="#C1F11D" stroke="#111111" stroke-width="1.5"/><text x="680" y="288" font-size="15" fill="#111111" text-anchor="middle" font-weight="700">6</text><text x="706" y="288" font-size="16.5" fill="#111111" text-anchor="start" font-weight="700">Cierre</text><text x="666" y="326" font-size="13" fill="#2F7D00" text-anchor="start" font-weight="700">tras finalizar</text><text x="666" y="352" font-size="13" fill="#6B7280" text-anchor="start">1 pago por viaje; hasta 2</text><text x="666" y="371" font-size="13" fill="#6B7280" text-anchor="start">calificaciones</text><polyline points="294,105 336,105" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><polyline points="604,105 646,105" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><polyline points="294,325 336,325" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><polyline points="604,325 646,325" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><polyline points="780.0,180 780.0,215 160.0,215 160.0,250" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#flecha)"/><rect x="30" y="432" width="880" height="56" rx="12" fill="#F3F6EC" stroke="none" stroke-width="0"/><text x="46" y="456" font-size="13" fill="#111111" text-anchor="start" font-weight="700">Alternativa en el paso 1: la solicitud puede pasar a «cancelada» mientras esté abierta;</text><text x="46" y="476" font-size="13" fill="#6B7280" text-anchor="start">sus ofertas se conservan.</text><text x="30" y="520" font-size="12" fill="#6B7280" text-anchor="start">Todo el historial (viajes, pagos, calificaciones) se conserva: FK RESTRICT y triggers.</text></svg>