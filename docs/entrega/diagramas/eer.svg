roke-width="0"/><text x="52" y="354" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">PK</text><text x="82" y="354" font-size="13" fill="#111111" text-anchor="start" font-weight="700">id_solicitud</text><rect x="30" y="364" width="44" height="17" rx="8" fill="#E5E7EB" stroke="none" stroke-width="0"/><text x="52" y="377" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">FK</text><text x="82" y="377" font-size="13" fill="#111111" text-anchor="start">id_usuario</text><text x="82" y="400" font-size="13" fill="#111111" text-anchor="start">origen</text><text x="82" y="423" font-size="13" fill="#111111" text-anchor="start">destino</text><text x="82" y="446" font-size="13" fill="#111111" text-anchor="start">precio_ofrecido</text><text x="82" y="469" font-size="13" fill="#111111" text-anchor="start">estado</text><text x="82" y="492" font-size="13" fill="#111111" text-anchor="start">fecha_solicitud</text><rect x="330" y="330" width="200" height="60" rx="30" fill="white" stroke="#2F7D00" stroke-width="1.8" stroke-dasharray="7 5"/><text x="430" y="356" font-size="14" fill="#2F7D00" text-anchor="middle" font-weight="700">ROL: pasajero</text><text x="430" y="375" font-size="11.5" fill="#6B7280" text-anchor="middle">quien crea una solicitud</text><polyline points="290,360 330,360" fill="none" stroke="#2F7D00" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="430,330 430,237 155,237 155,203" fill="none" stroke="#2F7D00" stroke-width="1.6" stroke-dasharray="6 5"/><text x="430" y="414" font-size="12" fill="#6B7280" text-anchor="middle">No es un subtipo: el rol surge</text><text x="430" y="431" font-size="12" fill="#6B7280" text-anchor="middle">de la FK Solicitud.id_usuario</text><rect x="560" y="300" width="280" height="175" rx="12" fill="#F3F6EC" stroke="none" stroke-width="0"/><text x="578" y="328" font-size="13.5" fill="#111111" text-anchor="start" font-weight="700">Cómo se implementa</text><text x="578" y="354" font-size="12" fill="#111111" text-anchor="start" font-weight="700">Conductor.id_usuario:</text><text x="578" y="374" font-size="12" fill="#6B7280" text-anchor="start">· FK, UNIQUE y NOT NULL</text><text x="578" y="394" font-size="12" fill="#6B7280" text-anchor="start">· cada conductor = un usuario</text><text x="578" y="414" font-size="12" fill="#6B7280" text-anchor="start">· un usuario: máximo un perfil</text><text x="578" y="434" font-size="12" fill="#6B7280" text-anchor="start">· hay usuarios sin perfil de conductor</text><text x="578" y="454" font-size="12" fill="#6B7280" text-anchor="start">id_conductor se conserva como PK.</text><text x="20" y="568" font-size="12" fill="#6B7280" text-anchor="start">Notación: línea simple = especialización parcial; ⊂ = el subtipo es un subconjunto de la</text><text x="20" y="586" font-size="12" fill="#6B7280" text-anchor="start">superclase; línea punteada = rol, no una tabla nueva.</text></svg>